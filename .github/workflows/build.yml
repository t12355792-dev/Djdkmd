name: Build Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Этот шаг теперь сам скачает правильный Gradle, проигнорировав сломанный wrapper
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Find Project Root
      id: find-root
      run: |
        ROOT_DIR=$(find . -name "build.gradle" -exec dirname {} \; | head -n 1)
        if [ -z "$ROOT_DIR" ]; then
          echo "Error: build.gradle not found!"
          exit 1
        fi
        echo "project_dir=$ROOT_DIR" >> $GITHUB_OUTPUT

    # Вместо ./gradlew мы используем глобально установленный gradle
    - name: Build with Gradle
      working-directory: ${{ steps.find-root.outputs.project_dir }}
      run: gradle build

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: havenmod-artifacts
        path: |
          **/build/libs/*.jar
          !**/build/libs/*-dev.jar
